[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # O Prisma precisa gerar o client antes do build do Next (já coberto pelo
  # script `build`), e o Netlify precisa ignorar o download do Chromium.
  PRISMA_CLI_BINARY_TARGETS = "native"

# O runtime oficial do Next.js no Netlify. Cuida de SSR, rotas dinâmicas,
# middleware, ISR e otimização de imagens.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Cabeçalhos de segurança também são definidos em next.config.ts; estes cobrem
# os assets estáticos servidos direto pela CDN do Netlify.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
