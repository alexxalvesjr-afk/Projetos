<!-- Estoque Mypremium — cole isto em Netlify → Post processing → Snippet injection
     (opção "Insert before </body>"). Não precisa mexer em nenhum arquivo. -->
<style>
  #estoque-mypremium .mp-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;max-width:1200px;margin:0 auto}
  #estoque-mypremium .mp-card{background:#fff;border:1px solid #e4e4e7;border-radius:12px;overflow:hidden;color:#111}
  #estoque-mypremium .mp-card__foto{position:relative;aspect-ratio:4/3;background:#eee}
  #estoque-mypremium .mp-card__foto img{width:100%;height:100%;object-fit:cover;display:block}
  #estoque-mypremium .mp-selo{position:absolute;top:8px;left:8px;background:#111;color:#fff;font-size:11px;padding:2px 8px;border-radius:99px}
  #estoque-mypremium .mp-card__corpo{padding:12px}
  #estoque-mypremium .mp-card__titulo{font-size:15px;margin:0 0 4px}
  #estoque-mypremium .mp-card__ficha{font-size:12px;color:#666;margin:0 0 8px}
  #estoque-mypremium .mp-card__preco{font-size:18px;font-weight:700;margin:0 0 10px}
  #estoque-mypremium .mp-card__zap{display:inline-block;background:#128c7e;color:#fff;text-decoration:none;font-size:13px;padding:6px 10px;border-radius:8px}
  #estoque-mypremium .mp-estado{text-align:center;color:#666;padding:24px}
</style>
<script>
/**
 * Estoque Mypremium — carrega os carros do CRM neste site.
 *
 * Este arquivo é para o site da revenda hospedado FORA do CRM (o que está na
 * Netlify). Ele busca o estoque no navegador, então não precisa de build, de
 * repositório nem de reenviar arquivos quando um carro muda: quem publica é o
 * CRM, e a página lê o resultado a cada visita.
 *
 * COMO USAR
 * ---------
 * Há dois jeitos, e nenhum precisa ser repetido depois:
 *
 * A) Sem tocar em arquivo — Netlify → Site configuration → Build & deploy →
 *    Post processing → Snippet injection → Add snippet → colar o conteúdo de
 *    docs/snippet-netlify.html em "Insert before </body>".
 *
 * B) Com os arquivos em mãos — colocar este .js junto do index.html, criar
 *    <div id="estoque-mypremium"></div> onde os carros devem aparecer, e
 *    carregar o arquivo com uma tag "script src=estoque-mypremium.js defer".
 *
 * (A tag de fechamento não aparece escrita acima de propósito: este arquivo
 *  também é colado dentro de uma tag script, e um "</" seguido de "script"
 *  em qualquer lugar do texto encerraria a tag ali e quebraria o resto.)
 *
 * Se a div não existir, o script procura uma seção chamada #estoque, #carros
 * ou #veiculos; não achando nenhuma, cria a própria no fim da página.
 */

(function () {
  "use strict";

  var CONFIG = {
    // Endereço do CRM. Troque se você apontar um domínio próprio para ele.
    api: "https://projetos-fawn-two.vercel.app/api/publico/veiculos",
    loja: "mypremium-motors",
    // Onde os cards serão inseridos.
    seletor: "#estoque-mypremium",
    // Quantos carros mostrar. A API devolve no máximo 200.
    limite: 60,
  };

  /**
   * Descobre onde inserir a lista.
   *
   * Injetado pelo painel da Netlify, este script roda numa página cujo HTML
   * ninguém editou — então não dá para exigir que exista uma div preparada.
   * Procura, nesta ordem: o container explícito, uma seção que pareça ser a de
   * estoque, e por último cria a sua própria no fim da página. O último caso é
   * um palpite, mas um palpite visível é melhor que nada renderizado.
   */
  function acharContainer() {
    var explicito = document.querySelector(CONFIG.seletor);
    if (explicito) return explicito;

    var candidatos = ["estoque", "carros", "veiculos", "veículos", "inventario"];
    for (var i = 0; i < candidatos.length; i++) {
      var secao = document.getElementById(candidatos[i]);
      if (secao) {
        var alvo = document.createElement("div");
        alvo.id = "estoque-mypremium";
        secao.appendChild(alvo);
        return alvo;
      }
    }

    var novo = document.createElement("section");
    novo.id = "estoque-mypremium";
    novo.style.padding = "32px 16px";
    document.body.appendChild(novo);
    return novo;
  }

  var container = acharContainer();
  if (!container) return;

  // Preenchido pela resposta; montarCard() lê o WhatsApp da loja daqui.
  var dadosLoja = null;

  function texto(valor) {
    // Tudo que vem da API é tratado como texto, nunca como HTML. Um nome de
    // carro com "<" não pode virar marcação nesta página.
    return document.createTextNode(valor == null ? "" : String(valor));
  }

  function elemento(tag, classe, conteudo) {
    var el = document.createElement(tag);
    if (classe) el.className = classe;
    if (conteudo !== undefined) el.appendChild(texto(conteudo));
    return el;
  }

  function estado(mensagem) {
    container.textContent = "";
    container.appendChild(elemento("p", "mp-estado", mensagem));
  }

  function montarCard(veiculo) {
    var card = document.createElement("article");
    card.className = "mp-card" + (veiculo.destaque ? " mp-card--destaque" : "");

    if (veiculo.fotoCapa) {
      var figura = elemento("div", "mp-card__foto");
      var img = document.createElement("img");
      img.src = veiculo.fotoCapa;
      img.alt = veiculo.titulo;
      img.loading = "lazy";
      figura.appendChild(img);
      if (veiculo.reservado) {
        figura.appendChild(elemento("span", "mp-selo", "Reservado"));
      }
      card.appendChild(figura);
    }

    var corpo = elemento("div", "mp-card__corpo");
    corpo.appendChild(elemento("h3", "mp-card__titulo", veiculo.titulo));

    var ficha = [veiculo.ano, veiculo.kmFormatado, veiculo.cambio, veiculo.cor]
      .filter(Boolean)
      .join(" · ");
    corpo.appendChild(elemento("p", "mp-card__ficha", ficha));
    corpo.appendChild(elemento("p", "mp-card__preco", veiculo.preco));

    // Fala com a loja já sabendo de qual carro se trata.
    if (dadosLoja && dadosLoja.whatsapp) {
      var numero = String(dadosLoja.whatsapp).replace(/\D/g, "");
      if (numero.length <= 11) numero = "55" + numero;
      var zap = document.createElement("a");
      zap.className = "mp-card__zap";
      zap.href =
        "https://wa.me/" +
        numero +
        "?text=" +
        encodeURIComponent(
          "Olá! Tenho interesse no " + veiculo.titulo + " (" + veiculo.preco + ")",
        );
      zap.target = "_blank";
      zap.rel = "noopener noreferrer";
      zap.appendChild(texto("Falar no WhatsApp"));
      corpo.appendChild(zap);
    }

    card.appendChild(corpo);
    return card;
  }

  estado("Carregando estoque…");

  var url =
    CONFIG.api +
    "?loja=" +
    encodeURIComponent(CONFIG.loja) +
    "&limite=" +
    encodeURIComponent(CONFIG.limite);

  fetch(url)
    .then(function (resposta) {
      if (!resposta.ok) throw new Error("HTTP " + resposta.status);
      return resposta.json();
    })
    .then(function (dados) {
      dadosLoja = dados.loja;

      if (!dados.veiculos || dados.veiculos.length === 0) {
        estado("Nenhum veículo disponível no momento.");
        return;
      }

      var grade = elemento("div", "mp-grade");
      dados.veiculos.forEach(function (veiculo) {
        grade.appendChild(montarCard(veiculo));
      });

      container.textContent = "";
      container.appendChild(grade);
    })
    .catch(function (erro) {
      // Falhar em silêncio deixaria um buraco na página sem explicação.
      estado("Não foi possível carregar o estoque agora.");
      console.error("[estoque-mypremium]", erro);
    });
})();
</script>
